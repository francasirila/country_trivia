name: country_trivia
description: "A Flutter country trivia game - identify countries by their flags."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Networking
  http: ^1.2.2

  # Local Storage
  shared_preferences: ^2.3.3

  # Image Caching
  cached_network_image: ^3.4.1

  # Connectivity
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mockito: ^5.4.5
  build_runner: ^2.4.14

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/
